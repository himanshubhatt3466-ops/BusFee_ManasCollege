<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Manas College | Bus Fee Manager</title>
<style>
:root{--navy:#172554;--blue:#2563eb;--purple:#7c3aed;--bg:#f3f6fc;--ink:#172033;--muted:#68748b;--line:#e5eaf3;--green:#059669;--red:#dc2626;--orange:#d97706}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px/1.45 "Segoe UI",Arial,sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 14px;font-weight:650}.primary{background:var(--blue);color:#fff}.secondary{background:#e9efff;color:#2345a3}.danger{background:#fee2e2;color:#991b1b}.top{background:linear-gradient(115deg,#172554,#4338ca 65%,#7c3aed);color:white;padding:22px 26px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.brand{display:flex;gap:14px;align-items:center}.logo{width:54px;height:54px;border-radius:14px;background:#fff;color:#312e81;display:grid;place-items:center;font-size:23px;font-weight:900}.top h1{margin:0;font-size:24px}.top p{margin:3px 0 0;color:#dbeafe}.top-actions{display:flex;gap:8px;flex-wrap:wrap}.top-actions button{background:#ffffff20;color:white;border:1px solid #ffffff50}.layout{display:flex;min-height:calc(100vh - 100px)}aside{width:220px;padding:18px 12px;background:#fff;border-right:1px solid var(--line);flex-shrink:0}aside button{display:block;width:100%;text-align:left;background:transparent;color:#536078;margin:4px 0;padding:12px;border-radius:10px}aside button.active,aside button:hover{background:#eaf0ff;color:#2345c5}.main{padding:24px;min-width:0;flex:1}.pagehead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}.pagehead h2{margin:0;font-size:23px}.sub{color:var(--muted);margin-top:4px}.stats{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:14px;margin-bottom:18px}.stat{background:white;padding:17px;border-radius:15px;border:1px solid var(--line);box-shadow:0 3px 12px #263e6a08}.stat .label{color:var(--muted);font-size:12px;font-weight:650}.stat .num{font-size:25px;font-weight:800;margin-top:8px}.stat .foot{font-size:12px;color:#7c879a;margin-top:3px}.accent{height:4px;border-radius:4px;margin:-17px -17px 14px}.panels{display:grid;grid-template-columns:1.15fr 1fr;gap:16px}.panel{background:white;border:1px solid var(--line);border-radius:15px;padding:18px;margin-bottom:16px;min-width:0}.panel h3{margin:0 0 14px;font-size:16px}.bars{display:flex;flex-direction:column;gap:12px}.barrow{display:grid;grid-template-columns:100px 1fr 42px;gap:10px;align-items:center;font-size:12px}.track{height:10px;border-radius:8px;background:#eef2ff;overflow:hidden}.fill{height:100%;border-radius:8px;background:linear-gradient(90deg,#3b82f6,#8b5cf6)}.donutrow{display:flex;gap:20px;align-items:center;flex-wrap:wrap}.donut{width:130px;height:130px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#7c3aed 0 50%,#0ea5e9 50% 100%);position:relative}.donut:after{content:"";position:absolute;inset:20px;background:white;border-radius:50%}.donut strong{z-index:1;font-size:22px}.legend{display:grid;gap:10px}.legend span{display:flex;align-items:center;gap:8px}.dot{width:10px;height:10px;border-radius:50%;display:inline-block}.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.filters input,.filters select{max-width:230px}.fieldgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:12px;font-weight:700;color:#58647a}.field input,.field select,.field textarea,.filters input,.filters select{width:100%;padding:10px;border:1px solid #dce3ef;border-radius:9px;background:#fff;color:var(--ink);min-width:0}.field textarea{min-height:70px}.wide{grid-column:1/-1}.formactions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}.tablewrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px}table{border-collapse:collapse;width:100%;min-width:760px}th,td{text-align:left;padding:12px;border-bottom:1px solid #edf0f6;white-space:nowrap}th{background:#f8faff;color:#59667e;font-size:11px;text-transform:uppercase;letter-spacing:.04em}tr:last-child td{border-bottom:0}.pill{padding:4px 8px;border-radius:99px;font-size:11px;font-weight:750;background:#e0f2fe;color:#075985}.pill.paid{background:#d1fae5;color:#065f46}.pill.pending{background:#ffedd5;color:#9a3412}.smallbtn{padding:6px 9px;font-size:12px;margin-right:4px}.empty{text-align:center;padding:30px;color:var(--muted)}.hidden{display:none!important}.notice{padding:12px 14px;border-radius:10px;background:#fff7ed;color:#9a3412;margin-bottom:15px}.toast{position:fixed;bottom:20px;right:20px;background:#172554;color:#fff;padding:12px 18px;border-radius:10px;box-shadow:0 6px 30px #0002;z-index:20}.muted{color:var(--muted)}.receipt{max-width:760px;margin:auto;background:white;border:2px solid #253b80;padding:26px;color:#111}.receipt-head{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #253b80;padding-bottom:14px}.receipt h2{margin:0;color:#253b80}.receipt table{min-width:0}.receipt .sign{display:flex;justify-content:space-between;margin-top:40px}.receipt .sign img{max-width:120px;max-height:55px;object-fit:contain}.filelabel{display:inline-block;padding:9px 12px;background:#eef2ff;color:#263eaa;border-radius:9px;cursor:pointer;font-weight:650}.footer{font-size:12px;color:#778198;text-align:center;padding:22px}
@media(max-width:1000px){.stats{grid-template-columns:repeat(2,minmax(140px,1fr))}.panels{grid-template-columns:1fr}.fieldgrid{grid-template-columns:repeat(2,minmax(0,1fr))}aside{width:175px}}
@media(max-width:650px){.layout{display:block}aside{width:100%;display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}aside button{width:auto;white-space:nowrap}.main{padding:14px}.stats{gap:9px}.stat{padding:13px}.stat .num{font-size:20px}.accent{margin:-13px -13px 12px}.fieldgrid{grid-template-columns:1fr}.top{padding:17px}.top h1{font-size:20px}.logo{width:45px;height:45px}}
@media print{body{background:#fff}.top,aside,.pagehead,.no-print,.footer{display:none!important}.layout,.main{display:block;padding:0}.receipt{border:1px solid #555;max-width:none}.receipt table{width:100%}}
</style></head>
<body>
<header class="top"><div class="brand"><div class="logo" id="brandLogo">MC</div><div><h1>Manas College Pithoragarh</h1><p>Bus Fee Management System</p></div></div><div class="top-actions"><button onclick="exportData()">⬇ Export backup</button><button onclick="document.getElementById('importFile').click()">⬆ Import backup</button><input id="importFile" type="file" accept=".json" hidden onchange="importData(event)"></div></header>
<div class="layout"><aside id="nav">
<button class="active" data-page="dashboard">▦ Dashboard</button><button data-page="students">♙ Students</button><button data-page="buses">▤ Buses</button><button data-page="stops">⌖ Bus Stops & Fees</button><button data-page="payments">₹ Fee Payments</button><button data-page="search">⌕ Student History</button><button data-page="settings">⚙ College Settings</button>
</aside><main class="main"><section id="app"></section><div class="footer">Manas College Pithoragarh · Bus Fee Manager · Keep regular backups using Export backup.</div></main></div><div id="toast" class="toast hidden"></div>
<script>
const KEY='manasBusFeesV1';
const monthNow=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`};
const emptyDB=()=>({students:[],buses:[],stops:[],payments:[],skips:[],settings:{college:'Manas College Pithoragarh',logo:'',signature:'',receiptPrefix:'MCB',finePerDay:100,fineAfterDay:10}});
let db;try{db=JSON.parse(localStorage.getItem(KEY))||emptyDB()}catch{db=emptyDB()}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(n){return '₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2})}
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),2500)}
function monthLabel(m){if(!m)return '';let [y,mo]=m.split('-');return new Date(+y,+mo-1,1).toLocaleString('en-IN',{month:'long',year:'numeric'})}
function monthsFrom(m,n){let [y,mo]=m.split('-').map(Number),d=new Date(y,mo-1+n,1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}
function monthDiff(a,b){return (Number(b.slice(0,4))-Number(a.slice(0,4)))*12+(Number(b.slice(5,7))-Number(a.slice(5,7)))}
function feeFor(s){return Number(db.stops.find(x=>x.name===s.stop)?.fee||0)}
function busFor(s){return db.buses.find(x=>x.id===s.busId)?.number||'—'}
function paidFor(id,m){return db.payments.filter(p=>p.studentId===id&&p.months.includes(m)).reduce((a,p)=>a+p.allocations.filter(x=>x.month===m).reduce((b,x)=>b+x.amount,0),0)}
function fineFor(s,m){if(!s||!m)return 0;let due=Number(db.stops.find(x=>x.name===s.stop)?.fee||0);if(!due||db.skips.some(x=>x.studentId===s.id&&x.month===m)||paidFor(s.id,m)>=due)return 0;let today=new Date(),[y,mo]=m.split('-').map(Number),dueDate=new Date(y,mo-1,db.settings.fineAfterDay);let days=Math.max(0,Math.floor((today-dueDate)/86400000));return days*Number(db.settings.finePerDay||100)}
function skipped(id,m){return db.skips.some(x=>x.studentId===id&&x.month===m)}
function dueFor(s,m=monthNow()){if(skipped(s.id,m))return 0;return Math.max(0,feeFor(s)+fineFor(s,m)-paidFor(s.id,m))}
function totalPaidMonth(m){return db.payments.filter(p=>p.allocations.some(a=>a.month===m)).reduce((t,p)=>t+p.allocations.filter(a=>a.month===m).reduce((s,a)=>s+a.amount,0),0)}
function studentOptions(sel=''){return '<option value="">Select student…</option>'+db.students.map(s=>`<option value="${esc(s.id)}" ${s.id===sel?'selected':''}>${esc(s.id)} — ${esc(s.name)}</option>`).join('')}
function busOptions(sel=''){return '<option value="">Select bus…</option>'+db.buses.map(b=>`<option value="${esc(b.id)}" ${b.id===sel?'selected':''}>${esc(b.number)}${b.name?' · '+esc(b.name):''}</option>`).join('')}
function stopOptions(sel=''){return '<option value="">Select stop…</option>'+db.stops.map(s=>`<option value="${esc(s.name)}" ${s.name===sel?'selected':''}>${esc(s.name)} — ${money(s.fee)}</option>`).join('')}
function pageHead(title,sub,action=''){return `<div class="pagehead"><div><h2>${title}</h2><div class="sub">${sub}</div></div>${action}</div>`}
function stat(label,value,foot,color){return `<div class="stat"><div class="accent" style="background:${color}"></div><div class="label">${label}</div><div class="num">${value}</div><div class="foot">${foot||''}</div></div>`}
function setPage(p){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render(p)}
document.querySelectorAll('#nav button').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));
function render(p='dashboard'){window.currentPage=p;let app=document.getElementById('app');if(p==='dashboard')app.innerHTML=dashboard();if(p==='students')app.innerHTML=studentsPage();if(p==='buses')app.innerHTML=busesPage();if(p==='stops')app.innerHTML=stopsPage();if(p==='payments')app.innerHTML=paymentsPage();if(p==='search')app.innerHTML=searchPage();if(p==='settings')app.innerHTML=settingsPage()}
function dashboard(){
let m=monthNow(),prev=monthsFrom(m,-1),active=db.students.filter(s=>!s.inactive),boys=active.filter(s=>s.gender==='Boy').length,girls=active.filter(s=>s.gender==='Girl').length;
let pending=active.reduce((n,s)=>n+dueFor(s,m),0),fine=active.reduce((n,s)=>n+fineFor(s,m),0),busCount=db.buses.length;
let stops=db.stops.map(st=>({name:st.name,n:active.filter(s=>s.stop===st.name).length})).filter(x=>x.n).sort((a,b)=>b.n-a.n);
let busRows=db.buses.map(b=>{let ss=active.filter(s=>s.busId===b.id);return {number:b.number,n:ss.length,boys:ss.filter(s=>s.gender==='Boy').length,girls:ss.filter(s=>s.gender==='Girl').length}}).sort((a,b)=>a.number.localeCompare(b.number));
let max=Math.max(1,...stops.map(x=>x.n));
return `${pageHead('Dashboard','Live overview · '+monthLabel(m),`<button class="primary" onclick="setPage('payments')">＋ Record payment</button>`)}
<div class="stats">${stat('Total buses',busCount,'Registered buses','#3b82f6')}${stat('Bus students',active.length,'Boys '+boys+' · Girls '+girls,'#8b5cf6')}${stat('This month collection',money(totalPaidMonth(m)),monthLabel(m),'#10b981')}${stat('Previous month collection',money(totalPaidMonth(prev)),monthLabel(prev),'#f59e0b')}${stat('Pending fees this month',money(pending),'Includes calculated fines','#ef4444')}${stat('Total fine this month',money(fine),'Fine rate '+money(db.settings.finePerDay)+'/day','#f97316')}${stat('Total boys',boys,'Active students','#06b6d4')}${stat('Total girls',girls,'Active students','#ec4899')}</div>
<div class="panels"><div class="panel"><h3>Students by bus stop</h3><div class="bars">${stops.length?stops.map(x=>`<div class="barrow"><span title="${esc(x.name)}">${esc(x.name.length>16?x.name.slice(0,15)+'…':x.name)}</span><div class="track"><div class="fill" style="width:${x.n/max*100}%"></div></div><strong>${x.n}</strong></div>`).join(''):'<div class="empty">Add bus stops and students to see this chart.</div>'}</div></div>
<div class="panel"><h3>Student gender split</h3><div class="donutrow"><div class="donut" style="background:conic-gradient(#7c3aed 0 ${active.length?girls/active.length*100:0}%,#0ea5e9 ${active.length?girls/active.length*100:0}% 100%)"><strong>${active.length}</strong></div><div class="legend"><span><i class="dot" style="background:#0ea5e9"></i>Boys: <b>${boys}</b></span><span><i class="dot" style="background:#7c3aed"></i>Girls: <b>${girls}</b></span><span class="muted">Active bus students</span></div></div></div></div>
<div class="panel"><h3>Bus-wise students</h3>${busRows.length?`<div class="tablewrap"><table><thead><tr><th>Bus no.</th><th>Bus name</th><th>Total students</th><th>Boys</th><th>Girls</th></tr></thead><tbody>${busRows.map(b=>{let raw=db.buses.find(x=>x.number===b.number);return `<tr><td><b>${esc(b.number)}</b></td><td>${esc(raw?.name||'—')}</td><td>${b.n}</td><td>${b.boys}</td><td>${b.girls}</td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">No buses added yet.</div>'}</div>
<div class="panel"><h3>Quick setup</h3><p class="muted">Start by adding bus stops with their monthly fees, then add buses and register students. Data is saved in this browser.</p><button class="secondary" onclick="setPage('stops')">＋ Add bus stop / fee</button> <button class="secondary" onclick="setPage('buses')">＋ Add bus</button> <button class="secondary" onclick="setPage('students')">＋ Register student</button></div>`;
}
function studentsPage(){return `${pageHead('Student Registration','Add and manage bus students',`<button class="primary" onclick="studentForm()">＋ Add student</button>`)}<div class="filters"><input id="studentFilter" placeholder="Search ID, name, mobile…" oninput="filterTable('studentTable',this.value)"><select id="studentStopFilter" onchange="filterStudentsStop(this.value)"><option value="">All bus stops</option>${db.stops.map(s=>`<option>${esc(s.name)}</option>`).join('')}</select><select id="studentBusFilter" onchange="filterStudentsBus(this.value)"><option value="">All buses</option>${db.buses.map(b=>`<option value="${esc(b.id)}">${esc(b.number)}</option>`).join('')}</select></div><div id="studentFormSlot"></div><div class="tablewrap"><table id="studentTable"><thead><tr><th>ID card no.</th><th>Student name</th><th>Gender</th><th>Bus no.</th><th>Bus stop</th><th>Course</th><th>Semester</th><th>Mobile</th><th>Status</th><th>Actions</th></tr></thead><tbody>${db.students.map(s=>`<tr data-stop="${esc(s.stop)}" data-bus="${esc(s.busId)}"><td><b>${esc(s.id)}</b></td><td>${esc(s.name)}</td><td>${esc(s.gender||'—')}</td><td>${esc(busFor(s))}</td><td>${esc(s.stop)}</td><td>${esc(s.course)}</td><td>${esc(s.semester)}</td><td>${esc(s.mobile)}</td><td><span class="pill ${s.inactive?'pending':'paid'}">${s.inactive?'Inactive':'Active'}</span></td><td><button class="secondary smallbtn" onclick="editStudent('${esc(s.id)}')">Edit</button><button class="secondary smallbtn" onclick="historyStudent('${esc(s.id)}')">History</button><button class="danger smallbtn" onclick="toggleStudent('${esc(s.id)}')">${s.inactive?'Activate':'Disable'}</button></td></tr>`).join('')||'<tr><td colspan="10" class="empty">No students registered.</td></tr>'}</tbody></table></div>`}
function studentForm(id=''){let s=db.students.find(x=>x.id===id)||{};document.getElementById('studentFormSlot').innerHTML=`<div class="panel"><h3>${id?'Edit student':'New student'}</h3><form onsubmit="saveStudent(event,'${esc(id)}')"><div class="fieldgrid"><div class="field"><label>ID card number *</label><input name="id" required value="${esc(s.id||'')}" ${id?'readonly':''} placeholder="e.g. MC2026001"></div><div class="field"><label>Full name *</label><input name="name" required value="${esc(s.name||'')}"></div><div class="field"><label>Gender *</label><select name="gender" required><option value="">Select gender</option>${['Boy','Girl','Other'].map(g=>`<option ${s.gender===g?'selected':''}>${g}</option>`).join('')}</select></div><div class="field"><label>Bus stop *</label><select name="stop" required>${stopOptions(s.stop)}</select></div><div class="field"><label>Bus number *</label><select name="busId" required>${busOptions(s.busId)}</select></div><div class="field"><label>Mobile number *</label><input name="mobile" required value="${esc(s.mobile||'')}" inputmode="tel"></div><div class="field"><label>Course *</label><input name="course" required value="${esc(s.course||'')}" placeholder="BCA, B.Com…"></div><div class="field"><label>Semester *</label><select name="semester" required><option value="">Select semester</option>${['1','2','3','4','5','6','7','8','Annual','Other'].map(x=>`<option ${s.semester===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Admission status</label><select name="inactive"><option value="false">Active</option><option value="true" ${s.inactive?'selected':''}>Inactive</option></select></div></div><div class="formactions"><button type="button" class="secondary" onclick="document.getElementById('studentFormSlot').innerHTML=''">Cancel</button><button class="primary">Save student</button></div></form></div>`;document.getElementById('studentFormSlot').scrollIntoView({behavior:'smooth',block:'start'})}
function saveStudent(e,old){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));if(!db.stops.some(x=>x.name===f.stop)){toast('Please add the bus stop and fee first.');return}if(!db.buses.some(x=>x.id===f.busId)){toast('Please add a bus first.');return}let s={...f,inactive:f.inactive==='true'};if(old){db.students[db.students.findIndex(x=>x.id===old)]={...db.students.find(x=>x.id===old),...s}}else{if(db.students.some(x=>x.id===s.id)){toast('This ID card number already exists.');return}db.students.push(s)}save();render('students');toast('Student saved successfully.')}
function editStudent(id){studentForm(id)}function toggleStudent(id){let s=db.students.find(x=>x.id===id);s.inactive=!s.inactive;save();render('students')}
function filterTable(id,q){document.querySelectorAll('#'+id+' tbody tr').forEach(r=>r.style.display=r.textContent.toLowerCase().includes(q.toLowerCase())?'':'none')}
function filterStudentsStop(v){document.querySelectorAll('#studentTable tbody tr').forEach(r=>r.style.display=(!v||r.dataset.stop===v)?'':'none')}
function filterStudentsBus(v){document.querySelectorAll('#studentTable tbody tr').forEach(r=>r.style.display=(!v||r.dataset.bus===v)?'':'none')}
function busesPage(){return `${pageHead('Buses','Register buses and see student counts',`<button class="primary" onclick="busForm()">＋ Add bus</button>`)}<div id="busFormSlot"></div><div class="tablewrap"><table><thead><tr><th>Bus no.</th><th>Bus name / route</th><th>Capacity</th><th>Students</th><th>Boys</th><th>Girls</th><th>Actions</th></tr></thead><tbody>${db.buses.map(b=>{let ss=db.students.filter(s=>s.busId===b.id&&!s.inactive);return `<tr><td><b>${esc(b.number)}</b></td><td>${esc(b.name||'—')}</td><td>${esc(b.capacity||'—')}</td><td>${ss.length}</td><td>${ss.filter(s=>s.gender==='Boy').length}</td><td>${ss.filter(s=>s.gender==='Girl').length}</td><td><button class="secondary smallbtn" onclick="busForm('${esc(b.id)}')">Edit</button><button class="danger smallbtn" onclick="deleteBus('${esc(b.id)}')">Delete</button></td></tr>`}).join('')||'<tr><td colspan="7" class="empty">No buses added.</td></tr>'}</tbody></table></div>`}
function busForm(id=''){let b=db.buses.find(x=>x.id===id)||{};document.getElementById('busFormSlot').innerHTML=`<div class="panel"><h3>${id?'Edit bus':'Add bus'}</h3><form onsubmit="saveBus(event,'${esc(id)}')"><div class="fieldgrid"><div class="field"><label>Bus number *</label><input name="number" required value="${esc(b.number||'')}" placeholder="UK05-PA-0001"></div><div class="field"><label>Bus name / route</label><input name="name" value="${esc(b.name||'')}" placeholder="Main campus route"></div><div class="field"><label>Seating capacity</label><input name="capacity" type="number" min="1" value="${esc(b.capacity||'')}"></div></div><div class="formactions"><button type="button" class="secondary" onclick="render('buses')">Cancel</button><button class="primary">Save bus</button></div></form></div>`}
function saveBus(e,id){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));if(db.buses.some(b=>b.number.toLowerCase()===f.number.toLowerCase()&&b.id!==id)){toast('Bus number already exists.');return}if(id)Object.assign(db.buses.find(b=>b.id===id),f);else db.buses.push({id:'BUS'+Date.now(),...f});save();render('buses');toast('Bus saved.')}
function deleteBus(id){if(db.students.some(s=>s.busId===id)){toast('This bus has students. Reassign them before deleting.');return}if(confirm('Delete this bus?')){db.buses=db.buses.filter(b=>b.id!==id);save();render('buses')}}
function stopsPage(){return `${pageHead('Bus Stops & Monthly Fees','Each stop can have a different monthly fee',`<button class="primary" onclick="stopForm()">＋ Add bus stop</button>`)}<div id="stopFormSlot"></div><div class="tablewrap"><table><thead><tr><th>Bus stop</th><th>Monthly fee</th><th>Students</th><th>Actions</th></tr></thead><tbody>${db.stops.map(s=>`<tr><td><b>${esc(s.name)}</b></td><td>${money(s.fee)}</td><td>${db.students.filter(x=>x.stop===s.name&&!x.inactive).length}</td><td><button class="secondary smallbtn" onclick="stopForm('${esc(s.name)}')">Edit</button><button class="danger smallbtn" onclick="deleteStop('${esc(s.name)}')">Delete</button></td></tr>`).join('')||'<tr><td colspan="4" class="empty">Add stops and their monthly fees.</td></tr>'}</tbody></table></div><div class="notice" style="margin-top:14px">Fine rule: after the ${db.settings.fineAfterDay}th, ${money(db.settings.finePerDay)} per day is calculated until the monthly fee is paid. Verify this policy with college administration before use.</div>`}
function stopForm(old=''){let s=db.stops.find(x=>x.name===old)||{};document.getElementById('stopFormSlot').innerHTML=`<div class="panel"><h3>${old?'Edit stop':'Add bus stop'}</h3><form onsubmit="saveStop(event,'${esc(old)}')"><div class="fieldgrid"><div class="field"><label>Stop name *</label><input name="name" required value="${esc(s.name||'')}" ${old?'readonly':''} placeholder="e.g. Chandak"></div><div class="field"><label>Monthly fee (₹) *</label><input name="fee" type="number" min="0" step="1" required value="${esc(s.fee??'')}" placeholder="1500"></div></div><div class="formactions"><button type="button" class="secondary" onclick="render('stops')">Cancel</button><button class="primary">Save stop</button></div></form></div>`}
function saveStop(e,old){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));f.fee=Number(f.fee);if(old)Object.assign(db.stops.find(s=>s.name===old),f);else{if(db.stops.some(s=>s.name.toLowerCase()===f.name.toLowerCase())){toast('Stop already exists.');return}db.stops.push(f)}save();render('stops');toast('Stop saved.')}
function deleteStop(n){if(db.students.some(s=>s.stop===n)){toast('Students use this stop. Change their stop before deleting.');return}if(confirm('Delete stop?')){db.stops=db.stops.filter(s=>s.name!==n);save();render('stops')}}
function paymentsPage(){return `${pageHead('Fee Payments','Pay current month or advance multiple months',`<button class="primary" onclick="paymentForm()">＋ New payment</button>`)}<div id="paymentFormSlot"></div><div class="filters"><input placeholder="Search receipt, student or ID…" oninput="filterTable('paymentTable',this.value)"><select onchange="filterPaymentsMonth(this.value)"><option value="">All months</option>${[...new Set(db.payments.flatMap(p=>p.months))].sort().reverse().map(m=>`<option value="${m}">${monthLabel(m)}</option>`).join('')}</select></div><div class="tablewrap"><table id="paymentTable"><thead><tr><th>Receipt no.</th><th>Date</th><th>Student</th><th>Months covered</th><th>Amount</th><th>Mode</th><th>Actions</th></tr></thead><tbody>${db.payments.slice().reverse().map(p=>paymentRow(p)).join('')||'<tr><td colspan="7" class="empty">No payments recorded yet.</td></tr>'}</tbody></table></div>`}
function paymentRow(p){let s=db.students.find(s=>s.id===p.studentId);return `<tr data-months="${esc(p.months.join(','))}"><td><b>${esc(p.receipt)}</b></td><td>${esc(p.date)}</td><td>${esc(s?.name||'Deleted student')} (${esc(p.studentId)})</td><td>${p.months.map(monthLabel).join(', ')}</td><td><b>${money(p.amount)}</b></td><td>${esc(p.mode)}</td><td><button class="secondary smallbtn" onclick="showReceipt('${esc(p.receipt)}')">Receipt</button></td></tr>`}
function paymentForm(){document.getElementById('paymentFormSlot').innerHTML=`<div class="panel"><h3>Record fee payment</h3><form id="payForm" onsubmit="savePayment(event)"><div class="fieldgrid"><div class="field"><label>Student ID / name *</label><select id="payStudent" name="studentId" required onchange="paymentPreview()">${studentOptions()}</select></div><div class="field"><label>Starting month *</label><input type="month" id="payMonth" name="startMonth" value="${monthNow()}" required onchange="paymentPreview()"></div><div class="field"><label>Advance months (including selected month) *</label><select id="payCount" name="count" onchange="paymentPreview()">${Array.from({length:12},(_,i)=>`<option value="${i+1}">${i+1} month${i?'s':''}</option>`).join('')}</select></div><div class="field"><label>Payment mode *</label><select name="mode" required><option value="">Select mode</option>${['Cash','UPI','Online','Internet Banking','Debit/Credit Card','Cheque','Other'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>Transaction / reference no.</label><input name="reference" placeholder="Optional"></div><div class="field"><label>Payment date *</label><input type="date" name="date" value="${new Date().toISOString().slice(0,10)}" required></div><div class="field"><label>Amount received (₹) *</label><input id="payAmount" name="amount" type="number" min="1" step="0.01" required></div><div class="field"><label>Discount / adjustment (₹)</label><input name="discount" type="number" min="0" step="0.01" value="0"></div><div class="field"><label>Notes</label><input name="notes" placeholder="Optional"></div><div class="wide" id="payPreview" style="background:#f8faff;border-radius:10px;padding:12px">Select a student to calculate fee.</div></div><div class="formactions"><button type="button" class="secondary" onclick="render('payments')">Cancel</button><button class="primary">Save payment & generate receipt</button></div></form></div>`}
function paymentPreview(){let id=document.getElementById('payStudent').value,m=document.getElementById('payMonth').value,n=Number(document.getElementById('payCount').value||1),s=db.students.find(x=>x.id===id);if(!s||!m)return;let alloc=[];for(let i=0;i<n;i++){let mm=monthsFrom(m,i);alloc.push({month:mm,fee:feeFor(s),fine:fineFor(s,mm),already:paidFor(s.id,mm),skip:skipped(s.id,mm)})}let total=alloc.reduce((a,x)=>a+(x.skip?0:Math.max(0,x.fee+x.fine-x.already)),0);document.getElementById('payPreview').innerHTML=`<b>${esc(s.name)}</b> · Bus ${esc(busFor(s))} · Stop ${esc(s.stop)}<br>${alloc.map(x=>`${monthLabel(x.month)}: ${x.skip?'Skipped':money(Math.max(0,x.fee+x.fine-x.already))+(x.fine?' (includes fine '+money(x.fine)+')':'' )}`).join('<br>')}<hr><b>Calculated outstanding: ${money(total)}</b><br><label><input id="skipThisMonth" type="checkbox" onchange="paymentPreview()"> Student skipped bus this month (mark selected month skipped)</label>`;document.getElementById('payAmount').value=total||''}
function savePayment(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target)),s=db.students.find(x=>x.id===f.studentId);if(!s){toast('Select a valid student.');return}let months=Array.from({length:Number(f.count)},(_,i)=>monthsFrom(f.startMonth,i));if(document.getElementById('skipThisMonth')?.checked){if(!db.skips.some(x=>x.studentId===s.id&&x.month===f.startMonth))db.skips.push({studentId:s.id,month:f.startMonth});months=months.filter(m=>m!==f.startMonth)}let amount=Number(f.amount),discount=Number(f.discount||0);if(amount<=0){toast('Enter amount received.');return}let receipt=`${db.settings.receiptPrefix||'MCB'}-${new Date().getFullYear()}-${String(Date.now()).slice(-6)}`;let remaining=amount+discount,allocations=[];for(let m of months){let due=Math.max(0,feeFor(s)+fineFor(s,m)-paidFor(s.id,m));let a=Math.min(due,remaining);if(a>0){allocations.push({month:m,amount:a});remaining-=a}}if(remaining>0){let last=months[months.length-1]||f.startMonth;allocations.push({month:last,amount:remaining})}let p={receipt,date:f.date,studentId:s.id,months,amount,discount,mode:f.mode,reference:f.reference,notes:f.notes,allocations};db.payments.push(p);save();render('payments');showReceipt(receipt);toast('Payment saved. Receipt generated.')}
function filterPaymentsMonth(m){document.querySelectorAll('#paymentTable tbody tr').forEach(r=>r.style.display=(!m||r.dataset.months.split(',').includes(m))?'':'none')}
function showReceipt(receipt){let p=db.payments.find(x=>x.receipt===receipt);if(!p)return;let s=db.students.find(x=>x.id===p.studentId)||{},logo=db.settings.logo?`<img src="${db.settings.logo}" style="max-width:80px;max-height:70px;object-fit:contain">`:'<div class="logo">MC</div>';let sign=db.settings.signature?`<img src="${db.settings.signature}">`:'';let html=`<div class="receipt"><div class="receipt-head"><div>${logo}</div><div style="text-align:right"><h2>${esc(db.settings.college)}</h2><div>BUS FEE PAYMENT RECEIPT</div></div></div><div style="display:flex;justify-content:space-between;margin:18px 0"><div><b>Receipt:</b> ${esc(p.receipt)}<br><b>Date:</b> ${esc(p.date)}</div><div><b>Payment mode:</b> ${esc(p.mode)}<br><b>Reference:</b> ${esc(p.reference||'—')}</div></div><p><b>Student:</b> ${esc(s.name||'')} &nbsp; <b>ID:</b> ${esc(p.studentId)}<br><b>Course / Semester:</b> ${esc(s.course||'')} / ${esc(s.semester||'')}<br><b>Bus / Stop:</b> ${esc(busFor(s))} / ${esc(s.stop||'')}</p><table><thead><tr><th>Month</th><th>Fee allocated</th></tr></thead><tbody>${p.allocations.map(a=>`<tr><td>${monthLabel(a.month)}</td><td>${money(a.amount)}</td></tr>`).join('')}</tbody></table><h2 style="text-align:right;margin-top:18px">Amount received: ${money(p.amount)}</h2>${p.discount?`<p style="text-align:right">Adjustment / discount: ${money(p.discount)}</p>`:''}<p>Amount in words: ${esc(numberWords(Math.round(p.amount)))} rupees only</p><p>Notes: ${esc(p.notes||'—')}</p><div class="sign"><div>Student / payer signature: ______________</div><div style="text-align:center">${sign}<div>Authorized Signatory</div></div></div><p style="text-align:center;color:#68748b;font-size:11px;margin-top:28px">This is a computer-generated receipt.</p></div>`;let w=window.open('','_blank');if(!w){toast('Allow pop-ups to print receipt.');return}w.document.write(`<html><head><title>${esc(p.receipt)}</title><style>body{font:14px Arial;padding:20px}.receipt{max-width:760px;margin:auto;border:2px solid #253b80;padding:26px}.receipt-head{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #253b80;padding-bottom:14px}h2{color:#253b80}.logo{width:50px;height:50px;display:grid;place-items:center;background:#eef2ff;font-weight:bold}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #ddd}.sign{display:flex;justify-content:space-between;margin-top:40px}.sign img{max-width:120px;max-height:55px}@media print{button{display:none}}</style></head><body>${html}<p style="text-align:center"><button onclick="window.print()">Print / Save as PDF</button></p></body></html>`);w.document.close()}
function numberWords(n){if(n===0)return 'zero';let a=['','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'],b=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];function under(x){if(x<20)return a[x];if(x<100)return b[Math.floor(x/10)]+(x%10?' '+a[x%10]:'');if(x<1000)return a[Math.floor(x/100)]+' hundred'+(x%100?' '+under(x%100):'');return ''}let parts=[];for(let [v,label] of [[10000000,'crore'],[100000,'lakh'],[1000,'thousand'],[1,'']]){if(n>=v){let q=Math.floor(n/v);parts.push(under(q)+' '+label);n%=v}}return parts.join(' ').trim()}
function searchPage(){return `${pageHead('Student History','Search by ID card number, name or mobile') }<div class="panel"><div class="filters"><input id="historyQuery" placeholder="Enter student ID, name or mobile" oninput="historyResults()" style="max-width:420px"><select id="historyStudent" onchange="showStudentHistory(this.value)"><option value="">Or select a student…</option>${db.students.map(s=>`<option value="${esc(s.id)}">${esc(s.id)} — ${esc(s.name)}</option>`).join('')}</select></div><div id="historyResults"><div class="empty">Search for a student to see month-by-month fee status.</div></div></div>`}
function historyResults(){let q=document.getElementById('historyQuery').value.toLowerCase(),matches=db.students.filter(s=>(s.id+' '+s.name+' '+s.mobile).toLowerCase().includes(q));document.getElementById('historyResults').innerHTML=matches.length?matches.map(s=>`<button class="secondary" style="margin:4px" onclick="showStudentHistory('${esc(s.id)}')">${esc(s.id)} · ${esc(s.name)}</button>`).join(''):'<div class="empty">No matching students.</div>'}
function historyStudent(id){setPage('search');document.getElementById('historyQuery').value=id;showStudentHistory(id)}
function showStudentHistory(id){let s=db.students.find(x=>x.id===id);if(!s)return;document.getElementById('historyStudent').value=id;let months=new Set();let start=monthsFrom(monthNow(),-11);for(let i=0;i<12;i++)months.add(monthsFrom(start,i));db.payments.filter(p=>p.studentId===id).forEach(p=>p.months.forEach(m=>months.add(m)));db.skips.filter(x=>x.studentId===id).forEach(x=>months.add(x.month));let rows=[...months].sort().reverse().map(m=>{let paid=paidFor(id,m),due=dueFor(s,m),skip=skipped(id,m),fine=fineFor(s,m);return `<tr><td>${monthLabel(m)}</td><td>${money(feeFor(s))}</td><td>${money(fine)}</td><td>${money(paid)}</td><td>${skip?'<span class="pill">Skipped</span>':due===0?'<span class="pill paid">Paid / no due</span>':'<span class="pill pending">Pending '+money(due)+'</span>'}</td><td>${db.payments.filter(p=>p.studentId===id&&p.months.includes(m)).map(p=>esc(p.receipt)).join(', ')||'—'}</td><td>${skip?'':`<button class="secondary smallbtn" onclick="skipMonth('${esc(id)}','${m}')">Skip month</button>`}</td></tr>`}).join('');document.getElementById('historyResults').innerHTML=`<h3>${esc(s.name)} <span class="muted">(${esc(s.id)})</span></h3><p class="muted">Mobile: ${esc(s.mobile)} · Course: ${esc(s.course)} · Semester: ${esc(s.semester)} · Bus: ${esc(busFor(s))} · Stop: ${esc(s.stop)} · Monthly fee: ${money(feeFor(s))}</p><div class="tablewrap"><table><thead><tr><th>Month</th><th>Base fee</th><th>Fine</th><th>Paid</th><th>Status / due</th><th>Receipts</th><th>Action</th></tr></thead><tbody>${rows}</tbody></table></div>`}
function skipMonth(id,m){if(!confirm('Mark bus fee as skipped for '+monthLabel(m)+'? This does not delete previous payments.'))return;if(!db.skips.some(x=>x.studentId===id&&x.month===m))db.skips.push({studentId:id,month:m});save();showStudentHistory(id);toast('Month marked as skipped.')}
function settingsPage(){return `${pageHead('College Settings','Receipt branding and fine policy')}<div class="panel"><form onsubmit="saveSettings(event)"><div class="fieldgrid"><div class="field"><label>College name *</label><input name="college" required value="${esc(db.settings.college)}"></div><div class="field"><label>Receipt prefix</label><input name="receiptPrefix" value="${esc(db.settings.receiptPrefix)}"></div><div class="field"><label>Fine per day (₹)</label><input name="finePerDay" type="number" min="0" value="${esc(db.settings.finePerDay)}"></div><div class="field"><label>Fine starts after day of month</label><input name="fineAfterDay" type="number" min="1" max="28" value="${esc(db.settings.fineAfterDay)}"></div><div class="field"><label>College logo (image)</label><input type="file" id="logoFile" accept="image/*"><small class="muted">Optional. Shows on receipts.</small>${db.settings.logo?'<img src="'+db.settings.logo+'" style="max-width:90px;max-height:60px">':''}</div><div class="field"><label>Authorized signature (image)</label><input type="file" id="signFile" accept="image/*"><small class="muted">Optional. Upload only an approved signature.</small>${db.settings.signature?'<img src="'+db.settings.signature+'" style="max-width:120px;max-height:60px">':''}</div></div><div class="formactions"><button class="primary">Save settings</button></div></form></div><div class="panel"><h3>Data management</h3><p class="muted">Records are currently stored in this browser on this computer. Export a JSON backup regularly and keep it in a safe place. Clearing browser data can erase records. For multi-computer use and automatic Google Cloud backups, connect a cloud database and configure credentials; GitHub Pages alone cannot securely perform that backup.</p><button class="secondary" onclick="exportData()">Export full JSON backup</button> <button class="secondary" onclick="document.getElementById('importFile').click()">Import JSON backup</button> <button class="danger" onclick="clearData()">Clear all data</button></div>`}
function saveSettings(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));f.finePerDay=Number(f.finePerDay);f.fineAfterDay=Number(f.fineAfterDay);let files=[['logoFile','logo'],['signFile','signature']].filter(([id])=>document.getElementById(id).files[0]);let read=files.map(([id,key])=>new Promise(resolve=>{let r=new FileReader();r.onload=()=>{f[key]=r.result;resolve()};r.readAsDataURL(document.getElementById(id).files[0])}));Promise.all(read).then(()=>{db.settings={...db.settings,...f};save();render('settings');toast('Settings saved.')})}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ManasCollege-BusFees-Backup-'+monthNow()+'.json';a.click();URL.revokeObjectURL(url);toast('Backup exported.')}
function importData(e){let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d.students||!d.buses||!d.stops||!d.payments)throw Error();if(!confirm('Import will replace the current data. Continue?'))return;db=d;save();render('dashboard');toast('Backup imported.')}catch{alert('Invalid backup file.')}e.target.value=''};r.readAsText(file)}
function clearData(){if(confirm('Permanently clear all students, buses, stops and payments from this browser? Export a backup first.')){db=emptyDB();save();render('dashboard');toast('Local data cleared.')}}
render('dashboard');
</script></body></html>
