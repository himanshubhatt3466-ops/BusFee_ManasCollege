*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px/1.45 "Segoe UI",Arial,sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 14px;font-weight:650}.primary{background:var(--blue);color:#fff}.secondary{background:#e9efff;color:#2345a3}.danger{background:#fee2e2;color:#991b1b}.top{background:linear-gradient(115deg,#172554,#4338ca 65%,#7c3aed);color:white;padding:22px 26px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.brand{display:flex;gap:14px;align-items:center}.logo{width:54px;height:54px;border-radius:14px;background:#fff;color:#312e81;display:grid;place-items:center;font-size:23px;font-weight:900}.top h1{margin:0;font-size:24px}.top p{margin:3px 0 0;color:#dbeafe}.top-actions{display:flex;gap:8px;flex-wrap:wrap}.top-actions button{background:#ffffff20;color:white;border:1px solid #ffffff50}.layout{display:flex;min-height:calc(100vh - 100px)}aside{width:220px;padding:18px 12px;background:#fff;border-right:1px solid var(--line);flex-shrink:0}aside button{display:block;width:100%;text-align:left;background:transparent;color:#536078;margin:4px 0;padding:12px;border-radius:10px}aside button.active,aside button:hover{background:#eaf0ff;color:#2345c5}.main{padding:24px;min-width:0;flex:1}.pagehead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}.pagehead h2{margin:0;font-size:23px}.sub{color:var(--muted);margin-top:4px}.stats{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:14px;margin-bottom:18px}.stat{background:white;padding:17px;border-radius:15px;border:1px solid var(--line);box-shadow:0 3px 12px #263e6a08}.stat .label{color:var(--muted);font-size:12px;font-weight:650}.stat .num{font-size:25px;font-weight:800;margin-top:8px}.stat .foot{font-size:12px;color:#7c879a;margin-top:3px}.accent{height:4px;border-radius:4px;margin:-17px -17px 14px}.panels{display:g om:0}.pill{padding:4px 8px;border-radius:99px;font-size:11px;font-weight:750;background:#e0f2fe;color:#075985}.pill.paid{background:#d1fae5;color:#065f46}.pill.pending{background:#ffedd5;color:#9a3412}.smallbtn{padding:6px 9px;font-size:12px;margin-right:4px}.empty{text-align:center;padding:30px;color:var(--muted)}.hidden{display:none!important}.notice{padding:12px 14px;border-radius:10px;background:#fff7ed;color:#9a3412;margin-bottom:15px}.toast{position:fixed;bottom:20px;right:20px;background:#172554;color:#fff;padding:12px 18px;border-radius:10px;box-shadow:0 6px 30px #0002;z-index:20}.muted{color:var(--muted)}.receipt{max-width:760px;margin:auto;background:white;border:2px solid #253b80;padding:26px;color:#111}.receipt-head{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #253b80;padding-bottom:14px}.receipt h2{margin:0;color:#253b80}.receipt table{min-width:0}.receipt .sign{display:flex;justify-content:space-between;margin-top:40px}.receipt .sign img{max-width:120px;max-height:55px;object-fit:contain}.filelabel{display:inline-block;padding:9px 12px;background:#eef2ff;color:#263eaa;border-radius:9px;cursor:pointer;font-weight:650}.footer{font-size:12px;color:#778198;text-align:center;padding:22px}

function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(n){return '₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2})}
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),2500)}
function monthLabel(m){if(!m)return '';let [y,mo]=m.split('-');return new Date(+y,+mo-1,1).toLocaleString('en-IN',{month:'long',year:'numeric'})}
function monthsFrom(m,n){let [y,mo]=m.split('-').map(Number),d=new Date(y,mo-1+n,1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}
function monthDiff(a,b){return (Number(b.slice(0,4))-Number(a.slice(0,4)))*12+(Number(b.slice(5,7))-Number(a.slice(5,7)))}
function feeFor(s){return Number(db.stops.find(x=>x.name===s.stop)?.fee||0)}
function busFor(s){return db.buses.find(x=>x.id===s.busId)?.number||'—'}
function paidFor(id,m){return db.payments.filter(p=>p.studentId===id&&p.months.includes(m)).reduce((a,p)=>a+p.allocations.filter(x=>x.month===m).reduce((b,x)=>b+x.amount,0),0)}
function fineFor(s,m){if(!s||!m)return 0;let fee=Number(db.stops.find(x=>x.name===s.stop)?.fee||0);if(!fee||db.skips.some(x=>x.studentId===s.id&&x.month===m)||paidFor(s.id,m)>=fee)return 0;let today=new Date(),[y,mo]=m.split('-').map(Number),deadline=new Date(y,mo-1,10,23,59,59,999);return today>deadline?100:0}
function skipped(id,m){return db.skips.some(x=>x.studentId===id&&x.month===m)}
function dueFor(s,m=monthNow()){if(skipped(s.id,m))return 0;return Math.max(0,feeFor(s)+fineFor(s,m)-paidFor(s.id,m))}
function totalPaidMonth(m){return db.payments.filter(p=>p.allocations.some(a=>a.month===m)).reduce((t,p)=>t+p.allocations.filter(a=>a.month===m).reduce((s,a)=>s+a.amount,0),0)}
function studentOptions(sel=''){return '<option value="">Select student…</option>'+db.students.map(s=>`<option value="${esc(s.id)}" ${s.id===sel?'selected':''}>${esc(s.id)} — ${esc(s.name)}</option>`).join('')}
function busOptions(sel=''){return '<option value="">Select bus…</option>'+db.buses.map(b=>`<option value="${esc(b.id)}" ${b.id===sel?'selected':''}>${esc(b.number)}${b.name?' · '+esc(b.name):''}</option>`).join('')}
function stopOptions(sel=''){return '<option value="">Select stop…</option>'+db.stops.map(s=>`<option value="${esc(s.name)}" ${s.name===sel?'selected':''}>${esc(s.name)} — ${money(s.fee)}</option>`).join('')}
function pageHead(title,sub,action=''){return `<div class="pagehead"><div><h2>${title}</h2><div class="sub">${sub}</div></div>${action}</div>`}
function stat(label,value,foot,color){return `<div class="stat"><div class="accent" style="background:${color}"></div><div class="label">${label}</div><div class="num">${value}</div><div class="foot">${foot||''}</div></div>`}
function setPage(p){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render(p)}
document.querySelectorAll('#nav button').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));
function render(p='dashboard'){window.currentPage=p;let app=document.getElementById('app');if(p==='dashboard')app.innerHTML=dashboard();if(p==='students')app.innerHTML=studentsPage();if(p==='buses')app.innerHTML=busesPage();if(p==='stops')app.innerHTML=stopsPage();if(p==='payments')app.innerHTML=paymentsPage();if(p==='search')app.innerHTML=searchPage();if(p==='settings')app.innerHTML=settingsPage()}
function dashboard(){
let m=monthNow(),prev=monthsFrom(m,-1),active=db.students.filter(s=>!s.inactive),boys=active.filter(s=>s.gender==='Boy').length,girls=active.filter(s=>s.gender==='Girl').length;
let pending=active.reduce((n,s)=>n+dueFor(s,m),0),fine=active.reduce((n,s)=>n+fineFor(s,m),0),busCount=db.buses.length;
let stops=db.stops.map(st=>({name:st.name,n:active.filter(s=>s.stop===st.name).length})).filter(x=>x.n).sort((a,b)=>b.n-a.n);
let busRows=db.buses.map(b=>{let ss=active.filter(s=>s.busId===b.id);return {number:b.number,n:ss.length,boys:ss.filter(s=>s.gender==='Boy').length,girls:ss.filter(s=>s.gender==='Girl').length}}).sort((a,b)=>a.number.localeCompare(b.number));
let max=Math.max(1,...stops.map(x=>x.n));
return `${pageHead('Dashboard','Live overview · '+monthLabel(m),`<button class="primary" onclick="setPage('payments')">＋ Record payment</button>`)}

function studentsPage(){return `${pageHead('Student Registration','Add and manage bus students',`<button class="primary" onclick="studentForm()">＋ Add student</button>`)}<div class="filters"><input id="studentFilter" placeholder="Search ID, name, mobile…" oninput="filterTable('studentTable',this.value)"><select id="studentStopFilter" onchange="filterStudentsStop(this.value)"><option value="">All bus stops</option>${db.stops.map(s=>`<option>${esc(s.name)}</option>`).join('')}</select><select id="studentBusFilter" onchange="filterStudentsBus(this.value)"><option value="">All buses</option>${db.buses.map(b=>`<option value="${esc(b.id)}">${esc(b.number)}</option>`).join('')}</select></div><div id="studentFormSlot"></div><div class="tablewrap"><table id="studentTable"><thead><tr><th>ID card no.</th><th>Student name</th><th>Gender</th><th>Bus no.</th><th>Bus stop</th><th>Course</th><th>Semester</th><th>Mobile</th><th>Status</th><th>Actions</th></tr></thead><tbody>${db.students.map(s=>`<tr data-stop="${esc(s.stop)}" data-bus="${esc(s.busId)}"><td><b>${esc(s.id)}</b></td><td>${esc(s.name)}</td><td>${esc(s.gender||'—')}</td><td>${esc(busFor(s))}</td><td>${esc(s.stop)}</td><td>${esc(s.course)}</td><td>${esc(s.semester)}</td><td>${esc(s.mobile)}</td><td><span class="pill ${s.inactive?'pending':'paid'}">${s.inactive?'Inactive':'Active'}</span></td><td><button class="secondary smallbtn" onclick="editStudent('${esc(s.id)}')">Edit</button><button class="secondary smallbtn" onclick="historyStudent('${esc(s.id)}')">History</button><button class="danger smallbtn" onclick="toggleStudent('${esc(s.id)}')">${s.inactive?'Activate':'Disable'}</button></td></tr>`).join('')||'<tr><td colspan="10" class="empty">No students registered.</td></tr>'}</tbody></table></div>`}

function paymentForm(){document.getElementById('paymentFormSlot').innerHTML=`<div class="panel"><h3>Record fee payment</h3><form id="payForm" onsubmit="savePayment(event)"><div class="fieldgrid"><div class="field"><label>Student ID / name *</label><select id="payStudent" name="studentId" required onchange="paymentPreview()">${studentOptions()}</select></div><div class="field"><label>Starting month *</label><input type="month" id="payMonth" name="startMonth" value="${monthNow()}" required onchange="paymentPreview()"></div><div class="field"><label>Advance months (including selected month) *</label><select id="payCount" name="count" onchange="paymentPreview()">${Array.from({length:12},(_,i)=>`<option value="${i+1}">${i+1} month${i?'s':''}</option>`).join('')}</select></div><div class="field"><label>Payment mode *</label><select name="mode" required><option value="">Select mode</option>${['Cash','UPI','Online','Internet Banking','Debit/Credit Card','Cheque','Other'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>Transaction / reference no.</label><input name="reference" placeholder="Optional"></div><div class="field"><label>Payment date *</label><input type="date" name="date" value="${new Date().toISOString().slice(0,10)}" required></div><div class="field"><label>Amount received (₹) *</label><input id="payAmount" name="amount" type="number" min="1" step="0.01" required></div><div class="field"><label>Discount / adjustment (₹)</label><input name="discount" type="number" min="0" step="0.01" value="0"></div><div class="field"><label>Notes</label><input name="notes" placeholder="Optional"></div><div class="wide" id="payPreview" style="background:#f8faff;border-radius:10px;padding:12px">Select a student to calculate fee.</div></div><div class="formactions"><button type="button" class="secondary" onclick="render('payments')">Cancel</button><button class="primary">Save payment & generate receipt</button></div></form></div>`}
function paymentPreview(){let id=document.getElementById('payStudent').value,m=document.getElementById('payMonth').value,n=Number(document.getElementById('payCount').value||1),s=db.students.find(x=>x.id===id);if(!s||!m)return;let alloc=[];for(let i=0;i<n;i++){let mm=monthsFrom(m,i);alloc.push({month:mm,fee:feeFor(s),fine:fineFor(s,mm),already:paidFor(s.id,mm),skip:skipped(s.id,mm)})}let total=alloc.reduce((a,x)=>a+(x.skip?0:Math.max(0,x.fee+x.fine-x.already)),0);document.getElementById('payPreview').innerHTML=`<b>${esc(s.name)}</b> · Bus ${esc(busFor(s))} · Stop ${esc(s.stop)}<br>${alloc.map(x=>`${monthLabel(x.month)}: ${x.skip?'Skipped':money(Math.max(0,x.fee+x.fine-x.already))+(x.fine?' (includes fine '+money(x.fine)+')':'' )}`).join('<br>')}<hr><b>Calculated outstanding: ${money(total)}</b><br><div style="margin-top:12px;padding:10px;border-radius:10px;background:${skipped(s.id,m)?'#ecfdf5':'#fff7ed'}"><b>${skipped(s.id,m)?'Status: Skipped for '+monthLabel(m):'Status: Bus fee applies for '+monthLabel(m)}</b><br><button type="button" class="${skipped(s.id,m)?'secondary':'primary'}" style="margin-top:8px" onclick="toggleSkippedMonth()"> ${skipped(s.id,m)?'Undo skipped / Restore fee':'Mark selected month skipped'}</button></div>`;document.getElementById('payAmount').value=total||''}
function toggleSkippedMonth(){let id=document.getElementById('payStudent')?.value,m=document.getElementById('payMonth')?.value,s=db.students.find(x=>x.id===id);if(!s||!m){toast('Select a student and month first.');return}let i=db.skips.findIndex(x=>x.studentId===s.id&&x.month===m);if(i>=0){db.skips.splice(i,1);save();toast('Skipped status removed. Fee restored for '+monthLabel(m)+'.')}else{db.skips.push({studentId:s.id,month:m});save();toast('Bus fee skipped for '+monthLabel(m)+'.')}paymentPreview();}
function savePayment(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target)),s=db.students.find(x=>x.id===f.studentId);if(!s){toast('Select a valid student.');return}let months=Array.from({length:Number(f.count)},(_,i)=>monthsFrom(f.startMonth,i));let amount=Number(f.amount),discount=Number(f.discount||0);if(amount<=0){toast('Enter amount received.');return}let receipt=`${db.settings.receiptPrefix||'MCB'}-${new Date().getFullYear()}-${String(Date.now()).slice(-6)}`;let remaining=amount+discount,allocations=[];for(let m of months){let due=Math.max(0,feeFor(s)+fineFor(s,m)-paidFor(s.id,m));let a=Math.min(due,remaining);if(a>0){allocations.push({month:m,amount:a});remaining-=a}}if(remaining>0){let last=months[months.length-1]||f.startMonth;allocations.push({month:last,amount:remaining})}let p={receipt,date:f.date,studentId:s.id,months,amount,discount,mode:f.mode,reference:f.reference,notes:f.notes,allocations};db.payments.push(p);save();render('payments');showReceipt(receipt);toast('Payment saved. Receipt generated.')}
function filterPaymentsMonth(m){document.querySelectorAll('#paymentTable tbody tr').forEach(r=>r.style.display=(!m||r.dataset.months.split(',').includes(m))?'':'none')}
function showReceipt(receipt){let p=db.payments.find(x=>x.receipt===receipt);if(!p)return;let s=db.students.find(x=>x.id===p.studentId)||{},logo=db.settings.logo?`<img src="${db.settings.logo}" style="max-width:80px;max-height:70px;object-fit:contain">`:'<div class="logo">MC</div>';let sign=db.settings.signature?`<img src="${db.settings.signature}">`:'';let html=`<div class="receipt"><div class="receipt-head"><div>${logo}</div><div style="text-align:right"><h2>${esc(db.settings.college)}</h2><div>BUS FEE PAYMENT RECEIPT</div></div></div><div style="display:flex;justify-content:space-between;margin:18px 0"><div><b>Receipt:</b> ${esc(p.receipt)}<br><b>Date:</b> ${esc(p.date)}</div><div><b>Payment mode:</b> ${esc(p.mode)}<br><b>Reference:</b> ${esc(p.reference||'—')}</div></div><p><b>Student:</b> ${esc(s.name||'')} &nbsp; <b>ID:</b> ${esc(p.studentId)}<br><b>Course / Semester:</b> ${esc(s.course||'')} / ${esc(s.semester||'')}<br><b>Bus / Stop:</b> ${esc(busFor(s))} / ${esc(s.stop||'')}</p><table><thead><tr><th>Month</th><th>Fee allocated</th></tr></thead><tbody>${p.allocations.map(a=>`<tr><td>${monthLabel(a.month)}</td><td>${money(a.amount)}</td></tr>`).join('')}</tbody></table><h2 style="text-align:right;margin-top:18px">Amount received: ${money(p.amount)}</h2>${p.discount?`<p style="text-align:right">Adjustment / discount: ${money(p.discount)}</p>`:''}<p>Amount in words: ${esc(numberWords(Math.round(p.amount)))} rupees only</p><p>Notes: ${esc(p.notes||'—')}</p><div class="sign"><div>Student / payer signature: ______________</div><div style="text-align:center">${sign}<div>Authorized Signatory</div></div></div><p style="text-align:center;color:#68748b;font-size:11px;margin-top:28px">This is a computer-generated receipt.</p></div>`;let w=window.open('','_blank');if(!w){toast('Allow pop-ups to print receipt.');return}w.document.write(`<html><head><title>${esc(p.receipt)}</title><style>body{font:14px Arial;padding:20px}.receipt{max-width:760px;margin:auto;border:2px solid #253b80;padding:26px}.receipt-head{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #253b80;padding-bottom:14px}h2{color:#253b80}.logo{width:50px;height:50px;display:grid;place-items:center;background:#eef2ff;font-weight:bold}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #ddd}.sign{display:flex;justify-content:space-between;margin-top:40px}.sign img{max-width:120px;max-height:55px}@media print{button{display:none}}</style></head><body>${html}<p style="text-align:center"><button onclick="window.print()">Print / Save as PDF</button></p></body></html>`);w.document.close()}
function numberWords(n){if(n===0)return 'zero';let a=['','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'],b=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];function under(x){if(x<20)return a[x];if(x<100)return b[Math.floor(x/10)]+(x%10?' '+a[x%10]:'');if(x<1000)return a[Math.floor(x/100)]+' hundred'+(x%100?' '+under(x%100):'');return ''}let parts=[];for(let [v,label] of [[10000000,'crore'],[100000,'lakh'],[1000,'thousand'],[1,'']]){if(n>=v){let q=Math.floor(n/v);parts.push(under(q)+' '+label);n%=v}}return parts.join(' ').trim()}

function skipMonth(id,m){if(!confirm('Mark bus fee as skipped for '+monthLabel(m)+'? This does not delete previous payments.'))return;if(!db.skips.some(x=>x.studentId===id&&x.month===m))db.skips.push({studentId:id,month:m});save();showStudentHistory(id);toast('Month marked as skipped.')}
function settingsPage(){return `${pageHead('College Settings','Receipt branding and fine policy')}<div class="panel"><form onsubmit="saveSettings(event)"><div class="fieldgrid"><div class="field"><label>College name *</label><input name="college" required value="${esc(db.settings.college)}"></div><div class="field"><label>Receipt prefix</label><input name="receiptPrefix" value="${esc(db.settings.receiptPrefix)}"></div><div class="field"><label>One-time fine per month (₹)</label><input name="finePerDay" type="number" min="0" value="100" disabled><small class="muted">Fixed at ₹100 one time after the 10th; not charged per day.</small></div><div class="field"><label>Fine applies after day of month</label><input name="fineAfterDay" type="number" min="10" max="10" value="10" disabled></div><div class="field"><label>College logo (image)</label><input type="file" id="logoFile" accept="image/*"><small class="muted">Optional. Shows on receipts.</small>${db.settings.logo?'<img src="'+db.settings.logo+'" style="max-width:90px;max-height:60px">':''}</div><div class="field"><label>Authorized signature (image)</label><input type="file" id="signFile" accept="image/*"><small class="muted">Optional. Upload only an approved signature.</small>${db.settings.signature?'<img src="'+db.settings.signature+'" style="max-width:120px;max-height:60px">':''}</div></div><div class="formactions"><button class="primary">Save settings</button></div></form></div><div class="panel"><h3>Data management</h3><p class="muted">Records are currently stored in this browser on this computer. Export a JSON backup regularly and keep it in a safe place. Clearing browser data can erase records. For multi-computer use and automatic Google Cloud backups, connect a cloud database and configure credentials; GitHub Pages alone cannot securely perform that backup.</p><button class="secondary" onclick="exportData()">Export full JSON backup</button> <button class="secondary" onclick="document.getElementById('importFile').click()">Import JSON backup</button> <button class="danger" onclick="clearData()">Clear all data</button></div>`}
function saveSettings(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));f.finePerDay=100;f.fineAfterDay=10;let files=[['logoFile','logo'],['signFile','signature']].filter(([id])=>document.getElementById(id).files[0]);let read=files.map(([id,key])=>new Promise(resolve=>{let r=new FileReader();r.onload=()=>{f[key]=r.result;resolve()};r.readAsDataURL(document.getElementById(id).files[0])}));Promise.all(read).then(()=>{db.settings={...db.settings,...f};save();render('settings');toast('Settings saved.')})}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ManasCollege-BusFees-Backup-'+monthNow()+'.json';a.click();URL.revokeObjectURL(url);toast('Backup exported.')}
function importData(e){let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d.students||!d.buses||!d.stops||!d.payments)throw Error();if(!confirm('Import will replace the current data. Continue?'))return;db=d;save();render('dashboard');toast('Backup imported.')}catch{alert('Invalid backup file.')}e.target.value=''};r.readAsText(file)}
function clearData(){if(confirm('Permanently clear all students, buses, stops and payments from this browser? Export a backup first.')){db=emptyDB();save();render('dashboard');toast('Local data cleared.')}}
render('dashboard');
</script></body></html>
